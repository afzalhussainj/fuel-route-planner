[project]
name = "fuel-route-api"
version = "0.1.0"
description = "US driving route planner with cost-effective fuel stops"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django==6.1.1",
    "djangorestframework==3.18.1",
    "drf-spectacular==0.30.0",
    "geonamescache==2.0.0",
    "httpx==0.28.1",
    "pyproj==3.8.0",
    "python-dotenv==1.2.3",
    "shapely==2.1.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-django==4.14.0",
    "ruff==0.16.7",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["apps", "config", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv]
package = false
